# Vérifier, puis mettre en ligne.
#
# À chaque envoi sur « main » : le site est joué de bout en bout dans un vrai
# navigateur (mode local, images, double de Firestore, collecte allumée), puis
# les contrastes des trois affichages sont recalculés. Si une vérification échoue,
# rien n'est mis en ligne : la version d'avant reste, et les captures d'écran sont
# jointes à l'exécution (onglet « Actions »).
#
# Si tout passe, le site part sur GitHub Pages avec toutes ses versions
# (outils/assembler_versions.sh) : l'adresse principale montre la dernière version
# publiée (la plus haute étiquette playtest-N), ce que voient les testeurs ; chaque
# version reste figée à …/playtest-N/ ; main, le travail en cours, va à …/dev/.
# Un envoi sur main ne change donc pas ce que voient les testeurs. Publier une
# version : README, « Versions ».
name: Vérifier et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # une mise en ligne commencée va au bout

jobs:
  verifier:
    name: Vérifier le site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer Playwright et Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Jouer une séance — mode local (démonstration)
        run: node outils/verifier_site.mjs

      - name: Jouer une séance — avec les images
        run: node outils/verifier_site.mjs images

      - name: Jouer une séance — double de Firestore, deux navigateurs
        run: node outils/verifier_site.mjs firebase

      - name: Jouer une séance — collecte allumée
        run: node outils/verifier_site.mjs firebase mesure

      - name: Contrastes des trois affichages
        run: python3 outils/verifier_contrastes.py

      - name: Garder les captures si quelque chose échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: outils/captures/
          retention-days: 7

  publier:
    name: Mettre en ligne (toutes les versions)
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publication     # une mise en ligne à la fois
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # toutes les étiquettes playtest-N, pas seulement le dernier commit

      - name: Assembler les versions (adresse principale, …/playtest-N/, …/dev/)
        run: bash outils/assembler_versions.sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4
