<body data-espace="eleve">
<p class="mode-local" id="mode-local" hidden>Version de démonstration : vos réponses restent dans ce navigateur.</p>

      <span data-theme-ici></span>

  </div>
  <nav class="prog" id="prog" aria-label="Progression"></nav>
  <div class="signal" id="signal" role="status" aria-live="polite" hidden></div>
</header>
<div class="page" id="app"><p class="hint">Chargement…</p></div>
<div class="bravo-zone" id="bravo" role="status" aria-live="polite"></div>
